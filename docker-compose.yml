services:
  backend:
    build:
      context: ./backend2
    ports:
      - "8092:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  node:
    build:
      context: ./backend2
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend2
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: ncc_2025_net
